# Local orchestration for the two Python services (architecture.md §8, plan Phase 3).
# Both read the top-level .env. The Next.js app (Resume Engine) is deployed
# separately on Vercel and is not part of this compose stack.
services:
  job-agent:
    build: ./services/job-agent
    container_name: platform-job-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - platform

  cold-mail:
    build: ./services/cold-mail
    container_name: platform-cold-mail
    ports:
      - "8001:8001"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - platform

networks:
  platform:
    driver: bridge
